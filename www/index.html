<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<link rel="stylesheet" href="styles.css">
<script>
  // Farbschema früh setzen, damit beim Start nichts aufblitzt
  (function () {
    try {
      var d = JSON.parse(localStorage.getItem('orbit-data') || '{}');
      var t = (d.settings && d.settings.theme) || 'system';
      if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
</head>
<body>
<div id="app">
  <main id="stage" aria-live="polite"></main>
  <button id="fab" class="fab" type="button" data-act="fab" aria-label="Neuer Eintrag">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav id="tabbar" aria-label="Hauptnavigation"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <input type="file" id="import-file" accept="application/json,.json,text/plain" hidden>
</div>
<script src="app.js"></script>
</body>
</html>
